<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria | Mascotas</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a th:href="@{/mascotas/index}" class="nav-link">Home</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link" data-widget="fullscreen" href="#" role="button">
                    <i class="fas fa-expand-arrows-alt"></i>
                </a>
            </li>
        </ul>
    </nav>
    
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/mascotas/index}" class="brand-link">
        <img th:src="@{/dist/img/AdminLTELogo.png}" alt="AdminLTE Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
        <span class="brand-text font-weight-light">Veterinaria</span>
        </a>
        <div class="sidebar">
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="image">
            <img th:src="@{/dist/img/user2-160x160.jpg}" class="img-circle elevation-2" alt="User Image">
            </div>
            <div class="info">
            <a href="#" class="d-block" th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre_completo : 'Usuario'}">Alexander Pierce</a>
            </div>
        </div>
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
            <li class="nav-item">
                <a th:href="@{/mascotas/listado_mascotas}" class="nav-link active">
                <i class="nav-icon fas fa-paw"></i>
                <p>Mascotas</p>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/citas}" class="nav-link">
                <i class="nav-icon fas fa-calendar-alt"></i>
                <p>Citas</p>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/historial}" class="nav-link">
                <i class="nav-icon fas fa-book-open"></i>
                <p>Historial Clinico</p>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/citas/estadistica}" class="nav-link">
                <i class="nav-icon fas fa-chart-pie"></i>
                <p>Estadistica</p>
                </a>
            </li>
            <li class="nav-header"></li>
            <li class="nav-item">
                <a th:href="@{/logout}" class="nav-link">
                <i class="nav-icon far fa-circle text-danger"></i>
                <p>Salir</p>
                </a>
            </li>
            </ul>
        </nav>
        </div>
    </aside>


    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Listado de Mascotas</h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="card">
                <div class="card-header border-transparent">
                    <h3 class="card-title">Mascotas Registradas</h3>
                    <div class="card-tools">
                        <a th:href="@{/mascotas/agregar_mascota}" class="btn btn-success btn-sm">
                            <i class="fas fa-plus"></i> Agregar Mascota
                        </a>
                    </div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped projects">
                        <thead>
                        <tr>
                            <th style="width: 1%">#</th>
                            <th style="width: 20%">Nombre</th>
                            <th style="width: 30%">Especie</th>
                            <th>Fecha Nacimiento</th>
                            <th style="width: 20%" class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="mascota : ${mascotas}">
                            <td th:text="${mascota.id}">1</td>
                            <td th:text="${mascota.nombre}">Nombre</td>
                            <td th:text="${mascota.especie}">Especie</td>
                            <td th:text="${mascota.fechaNacimiento}">Fecha</td>
                            <td class="project-actions text-center">
                                <a class="btn btn-info btn-sm" th:href="@{/mascotas/editar_mascota/{id}(id=${mascota.id})}">
                                    <i class="fas fa-pencil-alt"></i> Editar
                                </a>
                                <a class="btn btn-danger btn-sm" th:href="@{/mascotas/eliminar_mascota/{id}(id=${mascota.id})}">
                                    <i class="fas fa-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(mascotas)}">
                            <td colspan="5" class="text-center">No hay mascotas registradas.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>

<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
</body>
</html>
