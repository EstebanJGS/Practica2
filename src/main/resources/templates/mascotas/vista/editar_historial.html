<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria | Editar Historial</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a th:href="@{/mascotas/index}" class="nav-link">Inicio</a>
            </li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/mascotas/index}" class="brand-link">
            <img th:src="@{/dist/img/AdminLTELogo.png}" alt="AdminLTE Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
            <span class="brand-text font-weight-light">Veterinaria</span>
        </a>
        <div class="sidebar">
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="image">
                    <img th:src="@{/dist/img/user2-160x160.jpg}" class="img-circle elevation-2" alt="User Image">
                </div>
                <div class="info">
                    <a href="#" class="d-block" th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre_completo : 'Usuario'}">Usuario</a>
                </div>
            </div>
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                    <li class="nav-item">
                        <a th:href="@{/mascotas/listado_mascotas}" class="nav-link">
                            <i class="nav-icon fas fa-paw"></i>
                            <p>Mascotas</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/citas}" class="nav-link">
                            <i class="nav-icon fas fa-calendar-alt"></i>
                            <p>Citas</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/historial}" class="nav-link active">
                            <i class="nav-icon fas fa-book-open"></i>
                            <p>Historial Clinico</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/citas/estadistica}" class="nav-link">
                            <i class="nav-icon fas fa-chart-pie"></i>
                            <p>Estadistica</p>
                        </a>
                    </li>
                    <li class="nav-header"></li>
                    <li class="nav-item">
                        <a th:href="@{/logout}" class="nav-link">
                            <i class="nav-icon far fa-circle text-danger"></i>
                            <p>Salir</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Editar Historial Médico</h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <form th:action="@{/historial/actualizar}" th:object="${historial}" method="post">
                    <input type="hidden" th:field="*{historialId}">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="card card-warning">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="fas fa-edit mr-2"></i>Modificar Datos de la Consulta</h3>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label>Mascota</label>
                                        <select th:field="*{mascotaId}" class="form-control custom-select" required>
                                            <option value="">-- Seleccione una mascota --</option>
                                            <option th:each="m : ${mascotas}" th:value="${m.id}" th:text="${m.nombre}"></option>
                                        </select>
                                    </div>
                                    <div class="form-group"><label>Fecha de Consulta</label><input type="date" th:field="*{fechaConsulta}" class="form-control" required></div>
                                    <div class="form-group"><label>Diagnóstico</label><textarea th:field="*{diagnostico}" class="form-control" rows="2" required></textarea></div>
                                    <div class="form-group"><label>Tratamiento</label><textarea th:field="*{tratamiento}" class="form-control" rows="2"></textarea></div>
                                    <div class="form-group"><label>Veterinario</label><input type="text" th:field="*{veterinario}" class="form-control" required></div>
                                    <div class="form-group"><label>Notas Adicionales</label><textarea th:field="*{notas}" class="form-control" rows="2"></textarea></div>
                                </div>
                                <div class="card-footer">
                                    <button type="submit" class="btn btn-warning"><i class="fas fa-save mr-1"></i> Guardar Cambios</button>
                                    <a th:href="@{/historial}" class="btn btn-secondary ml-2"><i class="fas fa-times mr-1"></i> Cancelar</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script><script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script><script th:src="@{/dist/js/adminlte.min.js}"></script></body></html>
