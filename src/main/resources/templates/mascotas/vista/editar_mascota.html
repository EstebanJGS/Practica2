<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdminLTE 3 | Editar Mascota</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a th:href="@{/mascotas/listado_mascotas}" class="nav-link">Inicio</a>
            </li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/mascotas/index}" class="brand-link">
            <img th:src="@{/dist/img/AdminLTELogo.png}" alt="AdminLTE Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
            <span class="brand-text font-weight-light">Mascotas App</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item">
                        <a th:href="@{/mascotas/listado_mascotas}" class="nav-link">
                            <i class="nav-icon fas fa-list"></i>
                            <p>Listado de Mascotas</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Editar Mascota</h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <form th:action="@{/mascotas/actualizar}" method="post">
                <div class="row">
                    <div class="col-md-12">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h3 class="card-title">Información General</h3>
                            </div>
                            <div class="card-body">
                                <div class="form-group">
                                    <label for="inputID">ID Mascota</label>
                                    <input type="text" id="inputID" name="id" class="form-control" th:value="${mascota.id}" readonly>
                                </div>
                                <div class="form-group">
                                    <label for="inputName">Nombre de la Mascota</label>
                                    <input type="text" id="inputName" name="nombre" class="form-control" th:value="${mascota.nombre}" required>
                                </div>
                                <div class="form-group">
                                    <label for="inputEspecie">Especie</label>
                                    <select id="inputEspecie" name="especie" class="form-control custom-select" required>
                                        <option disabled>Selecciona una</option>
                                        <option value="Perro" th:selected="${mascota.especie == 'Perro'}">Perro</option>
                                        <option value="Gato" th:selected="${mascota.especie == 'Gato'}">Gato</option>
                                        <option value="Ave" th:selected="${mascota.especie == 'Ave'}">Ave</option>
                                        <option value="Otro" th:selected="${mascota.especie == 'Otro'}">Otro</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="inputFecha">Fecha de Nacimiento</label>
                                    <input type="date" id="inputFecha" name="fechaNacimiento" class="form-control" th:value="${mascota.fechaNacimiento}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <a th:href="@{/mascotas/listado_mascotas}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success float-right">Guardar Cambios</button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</div>

<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
</body>
</html>
