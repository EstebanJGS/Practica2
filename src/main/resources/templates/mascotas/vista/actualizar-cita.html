<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veterinaria | Actualizar Cita</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="../../../static/plugins/fontawesome-free/css/all.min.css" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
  <link rel="stylesheet" href="../../../static/dist/css/adminlte.min.css" th:href="@{/dist/css/adminlte.min.css}">
  <link rel="stylesheet" href="../../../static/plugins/overlayScrollbars/css/OverlayScrollbars.min.css" th:href="@{/plugins/overlayScrollbars/css/OverlayScrollbars.min.css}">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <div class="preloader flex-column justify-content-center align-items-center">
    <img class="animation__shake" src="../../../static/dist/img/AdminLTELogo.png" th:src="@{/dist/img/AdminLTELogo.png}" alt="AdminLTELogo" height="60" width="60">
  </div>

  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="../../index.html" th:href="@{/mascotas/index}" class="nav-link">Home</a>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="../../index.html" th:href="@{/mascotas/index}" class="brand-link">
      <img src="../../../static/dist/img/AdminLTELogo.png" th:src="@{/dist/img/AdminLTELogo.png}" alt="AdminLTE Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
      <span class="brand-text font-weight-light">Veterinaria</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <img src="../../../static/dist/img/user2-160x160.jpg" th:src="@{/dist/img/user2-160x160.jpg}" class="img-circle elevation-2" alt="User Image">
        </div>
        <div class="info">
          <a href="#" class="d-block" th:text="${session.usuario}">Alexander Pierce</a>
        </div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="#" th:href="@{/mascotas/listado_mascotas}" class="nav-link">
              <i class="nav-icon fas fa-paw"></i>
              <p>Mascotas</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" th:href="@{/citas}" class="nav-link active">
              <i class="nav-icon fas fa-calendar-alt"></i>
              <p>Citas</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" th:href="@{/historial}" class="nav-link">
              <i class="nav-icon fas fa-book-open"></i>
              <p>Historial Clinico</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" th:href="@{/citas/estadistica}" class="nav-link">
              <i class="nav-icon fas fa-chart-pie"></i>
              <p>Estadistica</p>
            </a>
          </li>
          <li class="nav-header"></li>
          <li class="nav-item">
            <a href="#" th:href="@{/logout}" class="nav-link">
              <i class="nav-icon far fa-circle"></i>
              <p>Salir</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Actualizar Cita</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="../../index.html" th:href="@{/mascotas/index}">Inicio</a></li>
              <li class="breadcrumb-item"><a href="list-citas.html" th:href="@{/citas}">Citas</a></li>
              <li class="breadcrumb-item active">Actualizar</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card card-warning">
              <div class="card-header">
                <h3 class="card-title"><i class="fas fa-edit mr-2"></i>Editar Cita</h3>
              </div>
              <form action="list-citas.html" th:action="@{/citas/actualizar}" th:object="${cita}" method="post">

                <input type="hidden" th:field="*{citaId}">

                <div class="card-body">

                  <div class="form-group">
                    <label for="mascotaId">ID Mascota <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="mascotaId"
                           th:field="*{mascotaId}" placeholder="Ej: 101" required>
                  </div>

                  <div class="form-group">
                    <label for="fechaHora">Fecha y Hora <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="fechaHora"
                           th:field="*{fechaHora}" required>
                  </div>

                  <div class="form-group">
                    <label for="motivo">Motivo <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="motivo"
                              th:field="*{motivo}" rows="3"
                              placeholder="Describa el motivo de la cita..." required></textarea>
                  </div>

                  <div class="form-group">
                    <label for="estado">Estado <span class="text-danger">*</span></label>
                    <select class="form-control" id="estado" th:field="*{estado}" required>
                      <option value="">-- Seleccione un estado --</option>
                      <option value="programada">Programada</option>
                      <option value="completada">Completada</option>
                      <option value="cancelada">Cancelada</option>
                    </select>
                  </div>

                  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save mr-1"></i> Actualizar Cita
                  </button>
                  <a href="list-citas.html" th:href="@{/citas}" class="btn btn-secondary ml-2">
                    <i class="fas fa-times mr-1"></i> Cancelar
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer">
    <strong>Copyright &copy; 2014-2021 <a href="https://adminlte.io">VetNet</a>.</strong>
    All rights reserved.
    <div class="float-right d-none d-sm-inline-block">
      <b>Version</b> 0.1.0
    </div>
  </footer>
  <aside class="control-sidebar control-sidebar-dark"></aside>
</div>

<script src="../../../static/plugins/jquery/jquery.min.js" th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script src="../../../static/plugins/bootstrap/js/bootstrap.bundle.min.js" th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script src="../../../static/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js" th:src="@{/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js}"></script>
<script src="../../../static/dist/js/adminlte.js" th:src="@{/dist/js/adminlte.js}"></script>
</body>
</html>
