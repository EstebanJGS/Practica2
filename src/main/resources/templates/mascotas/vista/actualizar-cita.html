<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veterinaria | Editar Cita</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
  <style>
    body, .content-wrapper { background: #f7f8fc !important; }
    .main-footer { background: #fff !important; color: #718096; border-top: 1px solid #e2e8f0; }
    .card { border: none !important; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .card-header { background: #fff !important; border-bottom: 1px solid #e2e8f0 !important; border-radius: 10px 10px 0 0 !important; padding: 16px 24px !important; }
    .card-title { color: #2d3748; font-weight: 600; font-size: 1rem; margin: 0; }
    .card-footer { background: #f7f8fc !important; border-top: 1px solid #e2e8f0 !important; border-radius: 0 0 10px 10px !important; }
    .content-header h1 { color: #2d3748; font-size: 1.4rem; }
    .btn-guardar { background: #3182ce !important; color: #fff !important; border: none; border-radius: 6px; }
    .btn-guardar:hover { background: #2b6cb0 !important; color: #fff !important; }
    .btn-cancelar { background: #f7f8fc !important; color: #718096 !important; border: 1px solid #e2e8f0 !important; border-radius: 6px; }
    .btn-cancelar:hover { background: #e2e8f0 !important; color: #4a5568 !important; }
    .form-control:focus { border-color: #bee3f8; box-shadow: 0 0 0 0.2rem rgba(66,153,225,0.15); }
    .breadcrumb { background: transparent; padding: 0; }
    .breadcrumb-item a { color: #68a0c8; }
    label { color: #4a5568; font-weight: 600; font-size: 0.88rem; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
      <li class="nav-item d-none d-sm-inline-block"><a th:href="@{/mascotas/index}" class="nav-link">Inicio</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a th:href="@{/mascotas/index}" class="brand-link">
      <img th:src="@{/dist/img/AdminLTELogo.png}" alt="Logo" class="brand-image img-circle elevation-3" style="opacity:.8">
      <span class="brand-text font-weight-light">Veterinaria</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><img th:src="@{/dist/img/user2-160x160.jpg}" class="img-circle elevation-2" alt="User Image"></div>
        <div class="info"><a href="#" class="d-block" th:text="${session.usuarioLogueado?.nombreCompleto ?: 'Usuario'}">Usuario</a></div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item"><a th:href="@{/mascotas/listado_mascotas}" class="nav-link"><i class="nav-icon fas fa-paw"></i><p>Mascotas</p></a></li>
          <li class="nav-item"><a th:href="@{/citas}" class="nav-link active"><i class="nav-icon fas fa-calendar-alt"></i><p>Citas</p></a></li>
          <li class="nav-item"><a th:href="@{/historial}" class="nav-link"><i class="nav-icon fas fa-book-open"></i><p>Historial Clínico</p></a></li>
          <li class="nav-item"><a th:href="@{/citas/estadistica}" class="nav-link"><i class="nav-icon fas fa-chart-pie"></i><p>Estadística</p></a></li>
          <li class="nav-header"></li>
          <li class="nav-item"><a th:href="@{/logout}" class="nav-link"><i class="nav-icon far fa-circle text-danger"></i><p>Salir</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1 class="m-0">Editar Cita</h1></div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a th:href="@{/mascotas/index}">Inicio</a></li>
              <li class="breadcrumb-item"><a th:href="@{/citas}">Citas</a></li>
              <li class="breadcrumb-item active">Editar</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <form th:action="@{/citas/actualizar}" th:object="${cita}" method="post">
              <input type="hidden" th:field="*{citaId}">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="fas fa-pencil-alt mr-2" style="color:#68a0c8;"></i>Modificar Cita</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label for="mascotaId">ID Mascota <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="mascotaId" th:field="*{mascotaId}" placeholder="Ej: 1" required>
                  </div>
                  <div class="form-group">
                    <label for="fechaHora">Fecha y Hora <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="fechaHora" th:field="*{fechaHora}" required>
                  </div>
                  <div class="form-group">
                    <label for="motivo">Motivo <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="motivo" th:field="*{motivo}" rows="3" required></textarea>
                  </div>
                  <div class="form-group">
                    <label for="estado">Estado <span class="text-danger">*</span></label>
                    <select class="form-control" id="estado" th:field="*{estado}" required>
                      <option value="">-- Seleccione un estado --</option>
                      <option value="programada">Programada</option>
                      <option value="completada">Completada</option>
                      <option value="cancelada">Cancelada</option>
                    </select>
                  </div>
                  <div class="alert" style="background:#fff5f5; color:#c53030; border:1px solid #fed7d7; border-radius:6px;" th:if="${error}" th:text="${error}"></div>
                </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-guardar"><i class="fas fa-save mr-1"></i> Guardar Cambios</button>
                  <a th:href="@{/citas}" class="btn btn-cancelar ml-2"><i class="fas fa-times mr-1"></i> Cancelar</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer">
    <strong>Copyright &copy; 2026 <a href="#" style="color:#68a0c8;">VetNet</a>.</strong> Todos los derechos reservados.
    <div class="float-right d-none d-sm-inline-block"><b>Versión</b> 0.1.0</div>
  </footer>
  <aside class="control-sidebar control-sidebar-dark"></aside>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.js}"></script>
</body>
</html>
